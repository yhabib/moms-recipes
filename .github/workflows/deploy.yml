# Deploys both canisters to mainnet on each push to `main`: first the backend, then the frontend.
# The `ICP_CI_PEM` secret holds the PEM key of an identity that controls both canisters.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Run one deploy at a time, and do not cancel a deploy that has started.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A manual run can start from any branch. Deploy only from `main`.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub sends a `deployment_status` with this URL. The board reads deploys of `production` only.
    environment:
      name: production
      url: https://xr3gt-2yaaa-aaack-aabsq-cai.icp.net
    env:
      ICP_CLI_VERSION: 1.8.0
      IC_WASM_VERSION: 0.11.1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install icp-cli, ic-wasm and mops
        run: npm install --global --no-audit --no-fund "@icp-sdk/icp-cli@$ICP_CLI_VERSION" "@icp-sdk/ic-wasm@$IC_WASM_VERSION" ic-mops

      - name: Import the CI identity
        env:
          ICP_CI_PEM: ${{ secrets.ICP_CI_PEM }}
        run: |
          set -e
          (umask 077 && set -C && printf '%s' "$ICP_CI_PEM" > ci.pem)
          trap 'rm -f ci.pem' EXIT
          icp identity import ci --from-pem ci.pem --storage plaintext
          rm ci.pem

      # Stop, snapshot, upgrade, then start and check. If a step fails, restore the snapshot.
      - name: Upgrade the backend
        run: scripts/upgrade-backend.sh ic ci

      # Runs only if the backend upgrade succeeds.
      - name: Deploy the frontend
        run: icp deploy frontend -e ic --identity ci
