# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.3.0/docs/schemas/icp-yaml-schema.json

canisters:
  - backend
  - frontend


networks:
  - name: local
    mode: managed
    # Serve Internet Identity on the local network at http://id.ai.localhost:8000,
    # so that sign-in works offline against locally deployed canisters.
    ii: true
