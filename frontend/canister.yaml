# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.3.0/docs/schemas/canister-yaml-schema.json

name: frontend

recipe:
  # https://github.com/dfinity/icp-cli-recipes/blob/main/recipes/static-site/README.md
  # IMPORTANT: This recipe requires icp-cli >= 0.2.7
  type: "@dfinity/static-site@v1.0.0"
  configuration:
    build:
      # Install the dependencies
      # Eventually you might want to use `npm ci` to lock your dependencies
      - npm install
      - npm run build
    dir: dist
    # Version metadata embedded in the wasm (readable with `icp canister metadata`).
    # Values are expanded by the shell, so $(...) works.
    metadata:
      - name: "service:version"
        value: "0.1.0"
        visibility: public
      - name: "service:git:sha"
        value: "$(git rev-parse HEAD)"
        visibility: public

settings:
  # Display metadata read by the Cloud Engine console ("Your apps and services"):
  # groups this app's canisters under one name, and the main canister supplies
  # the "Open" target and the app icon.
  # See https://skills.internetcomputer.org/.well-known/skills/deploy-to-cloud-engine/SKILL.md
  environment_variables:
    __META_PROJECT: "Mom's Recipes"
    __META_NAME: "Frontend"
    __META_MAIN_CANISTER: "true"
    __META_ICON_PATH: "/favicon.svg"
    # The frontend canister id is only known after the first deploy. Then set this
    # to https://<frontend-canister-id>.icp.net (find the id with
    # `icp canister status frontend -e ic -i`) and redeploy. Must be an absolute
    # https:// URL; without it the console shows no icon.
    # __META_BASE_URL: "https://<frontend-canister-id>.icp.net"
