# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.3.0/docs/schemas/canister-yaml-schema.json

name: frontend

recipe:
  # https://github.com/dfinity/icp-cli-recipes/blob/main/recipes/static-site/README.md
  # IMPORTANT: This recipe requires icp-cli >= 0.2.7
  type: "@dfinity/static-site@v1.0.0"
  configuration:
    build:
      # Install the dependencies
      # Eventually you might want to use `npm ci` to lock your dependencies
      - npm install
      - npm run build
    dir: dist
    # Build provenance that the cloud engine console reads.
    metadata:
      - name: service:git:sha
        value: $(git rev-parse HEAD)$(git diff --quiet HEAD 2>/dev/null || echo +dirty)
      - name: service:git:origin
        value: $(git remote get-url origin)
      - name: service:git:updated_at
        value: $(git log -1 --format=%cI)
      - name: service:version
        value: $(node -p "require('./package.json').version" 2>/dev/null || echo 1.0.0)

# The cloud engine console groups canisters with the same `__META_PROJECT` into one app.
# This is the main canister: the console reads the base URL and the icon from it.
settings:
  environment_variables:
    __META_PROJECT: "Mom's Recipes"
    __META_NAME: "Frontend"
    __META_MAIN_CANISTER: "true"
    __META_BASE_URL: "https://xr3gt-2yaaa-aaack-aabsq-cai.icp.net"
    __META_ICON_PATH: "/vite.svg"
